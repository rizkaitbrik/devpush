{% extends "layouts/app.html" %}

{% block title %}Sign in{% endblock %}

{% block app_content %}
<div class="flex flex-col items-center justify-center h-[calc(100vh-65px)]">
  <div class="w-full max-w-xs space-y-6">
    <h2 class="h2 text-center">Sign in to {{ app_name }}</h2>
    <section
      class="grid gap-4"
      x-data="{ loading: null }"
    >
      {% include "auth/partials/_form-password-login.html" %}
      <p class="text-center text-sm text-muted-foreground">
        {{ _("Don't have an account?") }}
        <a href="{{ url_for('auth_signup') }}" class="underline underline-offset-4 hover:text-foreground">{{ _("Sign up") }}</a>
      </p>
      <hr>
      <a href="{{ url_for('auth_login') }}" class="btn-outline w-full text-center">
        {{ _("Continue with magic link") }}
      </a>
    </section>
  </div>
</div>
{% endblock %}
